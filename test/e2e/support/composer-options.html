<!doctype html>
<html lang="en" class="console-ui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Composer options fixture</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { h, ref } from 'vue';
      import { createTooltipApp } from '/packages/web-core/test/e2e/tooltip-app.ts';
      import ElementPlus from 'element-plus';
      import 'element-plus/dist/index.css';
      import '/packages/web-core/src/styles.css';
      import ComposerToolbar from '/packages/web-core/src/view/composer/ComposerToolbar.vue';
      import { localePreferenceService } from '/packages/web-core/src/service/locale-preference-service.ts';

      const query = new URLSearchParams(location.search);
      document.documentElement.dataset.theme = query.get('theme') ?? 'daylight';
      localePreferenceService().setLocale('en-US');
      const selected = ref('model-0');
      const effort = ref('medium');
      const selection = ref(query.get('single') === 'effort' ? 'effort:medium' : 'model:model-0');
      const models = ref(
        Array.from(
          { length: query.get('single') === 'effort' ? 0 : query.has('short') ? 3 : 32 },
          (_, index) => ({
            id: `model-${index}`,
            label: query.has('compact-names')
              ? ['GPT-6-Luna', 'GPT-6.1 Terra', 'GPT-6.1-Sol Fast'][index % 3]
              : `Engineering model ${index + 1} with a descriptive configuration name`
          })
        )
      );
      createTooltipApp({
        setup: () => () =>
          h(
            'main',
            {
              style: `position:fixed;left:0;right:0;${query.has('top') ? 'top' : 'bottom'}:16px;padding:0 12px`
            },
            [
              h(ComposerToolbar, {
                draftSessionOpen: true,
                runner: 'mar-agent',
                runnerOptions: [
                  { value: 'mar-agent', label: 'MAR Agent' },
                  { value: 'codex', label: 'Codex' }
                ],
                runnerLoading: false,
                runnerLabel: 'MAR Agent',
                modelEffortSelection: selection.value,
                modelEffortLabel:
                  models.value.find((model) => model.id === selected.value)?.label ?? effort.value,
                selectedModel: selected.value,
                selectedEffort: effort.value,
                models: models.value,
                efforts:
                  query.get('single') === 'model'
                    ? []
                    : ['low', 'medium', 'high', 'xhigh', 'max', 'ultra'],
                access: 'auto',
                accessLabel: 'Auto',
                accessOptions: [
                  { id: 'auto', label: 'Auto' },
                  { id: 'full-access', label: 'Full access' }
                ],
                configurationDisabled: false,
                accessDisabled: false,
                fastEnabled: false,
                contextUsage: { percentage: 42 },
                contextUsageLabel: '42% used',
                canCompactContext: false,
                mobileViewport: query.has('mobile'),
                activeRun: undefined,
                canInterrupt: query.has('running'),
                interruptVisible: query.has('running'),
                inputHasContent: true,
                hasSelectedCommand: false,
                loading: false,
                attachmentsPending: false,
                effortLabel: String,
                onUpdateModelEffort(value) {
                  selection.value = value;
                  if (value.startsWith('model:')) selected.value = value.slice(6);
                  else effort.value = value.slice(7);
                }
              }),
              h('output', { 'data-testid': 'selected-model' }, selected.value),
              h('output', { 'data-testid': 'selected-effort' }, effort.value),
              query.has('dynamic')
                ? h(
                    'button',
                    {
                      onClick: () => {
                        models.value = [...models.value].reverse();
                      }
                    },
                    'Reverse models'
                  )
                : null
            ]
          )
      })
        .use(ElementPlus)
        .mount('#app');
    </script>
  </body>
</html>
