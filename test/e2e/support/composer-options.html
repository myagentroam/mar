<!doctype html>
<html lang="en" class="console-ui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Composer options fixture</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { h, ref } from 'vue';
      import { createTooltipApp } from '/packages/web-core/test/e2e/tooltip-app.ts';
      import '/packages/web-core/src/styles.css';
      import ComposerToolbar from '/packages/web-core/src/view/composer/ComposerToolbar.vue';
      import { createComposerConfigurationService } from '/packages/web-core/src/service/composer-configuration-service.ts';
      import { localePreferenceService } from '/packages/web-core/src/service/locale-preference-service.ts';

      const query = new URLSearchParams(location.search);
      document.documentElement.dataset.theme = query.get('theme') ?? 'daylight';
      localePreferenceService().setLocale(query.get('locale') === 'zh-CN' ? 'zh-CN' : 'en-US');
      const selected = ref('model-0');
      const effort = ref('medium');
      const access = ref('auto');
      const accessOptions = [
        { id: 'auto', label: 'Auto' },
        { id: 'full-access', label: 'Full access' }
      ];
      const selection = ref(query.get('single') === 'effort' ? 'effort:medium' : 'model:model-0');
      const models = ref(
        Array.from(
          { length: query.get('single') === 'effort' ? 0 : query.has('short') ? 3 : 32 },
          (_, index) => ({
            id: `model-${index}`,
            label: query.has('compact-names')
              ? ['GPT-6-Luna', 'GPT-6.1 Terra', 'GPT-6.1-Sol Fast'][index % 3]
              : `Engineering model ${index + 1} with a descriptive configuration name`
          })
        )
      );
      const configuration = query.has('unordered-efforts')
        ? createComposerConfigurationService({
            selectedSession: ref(),
            profiles: ref([
              {
                runner: 'mar-agent',
                models: models.value.map((model) => ({
                  ...model,
                  supportedEfforts: ['xhigh', 'high', 'max', 'low', 'medium'],
                  defaultEffort: 'high'
                })),
                accessOptions,
                commands: [],
                capabilities: []
              }
            ]),
            effortLabel: String
          })
        : undefined;
      configuration?.apply({
        runner: 'mar-agent',
        modelId: selected.value,
        effort: '',
        access: 'auto'
      });
      createTooltipApp({
        setup: () => () =>
          h(
            'main',
            {
              style: `position:fixed;left:0;right:0;${query.has('top') ? 'top' : 'bottom'}:16px;padding:0 12px`
            },
            [
              h(ComposerToolbar, {
                draftSessionOpen: !query.has('existing-session'),
                runner: 'mar-agent',
                runnerOptions: [
                  { value: 'mar-agent', label: 'MAR Agent' },
                  { value: 'codex', label: 'Codex' }
                ],
                runnerLoading: false,
                runnerLabel: 'MAR Agent',
                modelEffortSelection: selection.value,
                modelEffortLabel:
                  models.value.find((model) => model.id === selected.value)?.label ?? effort.value,
                selectedModel: selected.value,
                selectedEffort: configuration?.effort.value ?? effort.value,
                models: models.value,
                efforts:
                  configuration?.efforts.value ??
                  (query.get('single') === 'model'
                    ? []
                    : ['low', 'medium', 'high', 'xhigh', 'max', 'ultra']),
                access: access.value,
                accessLabel: accessOptions.find((option) => option.id === access.value)?.label,
                accessOptions,
                configurationDisabled: false,
                accessDisabled: false,
                fastEnabled: false,
                contextUsage: { percentage: 42 },
                contextUsageLabel: '42% used',
                canCompactContext: false,
                mobileViewport: query.has('mobile'),
                activeRun: query.has('running')
                  ? {
                      id: 'fixture-run',
                      status: 'RUNNING',
                      recoveryState: '',
                      clientMessageId: 'fixture-message'
                    }
                  : undefined,
                canInterrupt: query.has('running'),
                interruptVisible: query.has('running'),
                inputHasContent: !query.has('empty'),
                hasSelectedCommand: false,
                loading: false,
                submitting: query.has('submitting'),
                attachmentsPending: false,
                effortLabel: String,
                onUpdateAccess: (value) => (access.value = value),
                onUpdateModelEffort(value) {
                  selection.value = value;
                  if (value.startsWith('model:')) {
                    selected.value = value.slice(6);
                    configuration?.selectModel(selected.value, 'high');
                  } else {
                    effort.value = value.slice(7);
                    configuration?.selectEffort(effort.value);
                  }
                }
              }),
              h('output', { 'data-testid': 'selected-model' }, selected.value),
              h(
                'output',
                { 'data-testid': 'selected-effort' },
                configuration?.effort.value ?? effort.value
              ),
              query.has('dynamic')
                ? h(
                    'button',
                    {
                      onClick: () => {
                        models.value = [...models.value].reverse();
                      }
                    },
                    'Reverse models'
                  )
                : null
            ]
          )
      }).mount('#app');
    </script>
  </body>
</html>
