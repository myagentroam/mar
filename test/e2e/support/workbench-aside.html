<!doctype html>
<html lang="en" class="console-ui">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workbench Aside fixture</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { computed, defineComponent, h, onMounted, ref } from 'vue';
      import { createTooltipApp as createApp } from '/packages/web-core/test/e2e/tooltip-app.ts';
      import '/packages/web-core/src/styles.css';
      import { marUiLocaleKey } from '/packages/mar-ui/locale/index.ts';
      import en from '/packages/mar-ui/locale/en.ts';
      import zhCn from '/packages/mar-ui/locale/zh-cn.ts';
      import { localePreferenceService } from '/packages/web-core/src/service/locale-preference-service.ts';
      import WorkbenchAside from '/packages/web-core/src/view/workbench/WorkbenchAside.vue';
      import {
        MarTabs,
        MarTabPane,
        tabStripIdentity
      } from '/packages/mar-ui/components/tabs/index.ts';
      import { createWorkbenchAsideService } from '/packages/web-core/src/service/workbench-aside-service.ts';
      import { consoleKeyboardShortcutService } from '/packages/web-core/src/service/console-keyboard-shortcut-service.ts';
      import { workspaceKeys } from '/packages/web-core/src/service/console-shortcut-keys.ts';
      import { themePreferenceService } from '/packages/web-core/src/service/theme-preference-service.ts';
      import { chineseLongTitle, chineseToolLabels } from './workbench-aside-fixture-data.ts';

      const theme = new URLSearchParams(location.search).get('theme');
      const themes = themePreferenceService();
      if (theme === 'custom') {
        const custom = themes.saveCustomTheme(
          JSON.stringify({
            version: 1,
            name: 'Aside custom palette',
            colors: {
              '--mar-bg-tab-inactive': '#211a2b',
              '--mar-text-primary': '#f4eefc',
              '--mar-text-secondary': '#b0a2c2',
              '--mar-conversation-activity-fg': '#ec79c2',
              '--mar-fill-selection': '#43344f'
            }
          })
        );
        themes.setTheme(custom.id);
      } else themes.setTheme(theme === 'dark' ? 'vscode-dark-2026' : 'daylight');
      const language = new URLSearchParams(location.search).get('lang');
      const workspace = { nodeId: 'node-1', workspaceId: 'workspace-1' };
      const longTitle = new URLSearchParams(location.search).get('long-title');
      const childTitle = longTitle
        ? (longTitle === 'zh' ? chineseLongTitle : 'A long readable session title ').repeat(8)
        : 'Child';
      const aside = createWorkbenchAsideService();
      const tools = ['files', 'search', 'changes', 'history', 'terminal'];
      if (new URLSearchParams(location.search).has('browser')) tools.push('node-browser');
      aside.ensure(workspace, tools);
      aside.openSession({ ...workspace, sessionId: 'child' });
      if (!new URLSearchParams(location.search).has('active-child'))
        aside.selectTool(workspace, 'files');
      const terminalMounts = ref(0);
      const workspaceCloses = ref(0);
      const asideDraft = ref('Unsent Aside draft');
      const shortcutFixture = new URLSearchParams(location.search).has('shortcuts');
      if (shortcutFixture) {
        consoleKeyboardShortcutService.register({
          command: 'fixture.workspace.closeTab',
          priority: 10,
          scope: 'workspace',
          keys: workspaceKeys.close,
          when: () => true,
          execute: () => {
            workspaceCloses.value++;
            return 'HANDLED';
          }
        });
        document.addEventListener('keydown', (event) =>
          consoleKeyboardShortcutService.handle(event)
        );
        consoleKeyboardShortcutService.registerRegion({
          scope: 'pane',
          root: () => document.querySelector('#session textarea') ?? undefined,
          blocksOtherScopes: false
        });
        consoleKeyboardShortcutService.registerRegion({
          scope: 'terminal',
          root: () => document.querySelector('#terminal') ?? undefined,
          blocksOtherScopes: true
        });
      }
      const Inspector = defineComponent({
        props: { tool: String },
        setup(props) {
          const inspectorMounts = ref(0);
          onMounted(() => inspectorMounts.value++);
          return () =>
            h(
              'div',
              { 'data-testid': `tool-${props.tool}`, 'data-mounts': inspectorMounts.value },
              [
                `Tool ${props.tool}`,
                h('input', { 'aria-label': 'Inspector draft' }),
                h(
                  MarTabs,
                  { label: 'Nested tabs', appearance: 'workbench', modelValue: 'content' },
                  {
                    default: () => h(MarTabPane, { name: 'content', label: 'Content' })
                  }
                )
              ]
            );
        }
      });
      const Terminal = defineComponent({
        props: { visible: Boolean },
        setup(props) {
          onMounted(() => terminalMounts.value++);
          return () =>
            h(
              'div',
              {
                id: 'terminal',
                tabindex: 0,
                style: { display: props.visible ? '' : 'none' },
                'data-mounts': terminalMounts.value
              },
              'Terminal content'
            );
        }
      });
      createApp({
        setup() {
          const state = computed(() => aside.current(workspace));
          const genericActive = ref(
            new URLSearchParams(location.search).has('unselected') ? undefined : 'a'
          );
          const changes = ref(0);
          const genericItems = [
            { name: 'a', label: 'One', closeLabel: 'Close One' },
            { name: 'b', label: 'Disabled', disabled: true },
            { name: 'c', label: 'Last', closeLabel: 'Close Last' }
          ];
          const closed = ref('');
          const activations = ref(0);
          return () => [
            ...(shortcutFixture
              ? [
                  h('button', { id: 'main-focus' }, 'Main content'),
                  h('output', { id: 'workspace-closes' }, workspaceCloses.value),
                  h(
                    'button',
                    { onClick: () => aside.openSession({ ...workspace, sessionId: 'child' }) },
                    'Open Aside session'
                  )
                ]
              : []),
            h(
              WorkbenchAside,
              {
                workspace,
                state: state.value,
                tools: tools.map((id) => ({
                  id,
                  label:
                    id === 'node-browser'
                      ? 'Browser'
                      : language === 'zh'
                        ? chineseToolLabels[id]
                        : id[0].toUpperCase() + id.slice(1)
                })),
                sessions: [{ sessionId: 'child', title: childTitle, active: true }],
                tabLabel: 'Workbench Aside',
                closeLabel: (title) => `Close ${title}`,
                resizeLabel: 'Resize Aside',
                mobile: new URLSearchParams(location.search).has('mobile'),
                closeSurfaceLabel: 'Back to Main',
                style: { maxWidth: '100%' },
                width: new URLSearchParams(location.search).has('active-child') ? 250 : 500,
                minWidth: 200,
                maxWidth: 800,
                mode: 'content',
                onSelectTool: (target) => aside.selectTool(target, target.id),
                onSelectSession: (target) => aside.activateSession(target),
                onCloseSession: (target) => aside.closeSession(target)
              },
              {
                tool: ({ tool }) => h(Inspector, { tool }),
                terminal: ({ visible }) => h(Terminal, { visible }),
                session: ({ target }) =>
                  h('div', { id: 'session' }, [
                    `Session ${target.sessionId}`,
                    shortcutFixture &&
                      h('textarea', {
                        'aria-label': 'Aside draft',
                        value: asideDraft.value,
                        onInput: (event) => (asideDraft.value = event.target.value)
                      })
                  ])
              }
            ),
            h('div', { style: { width: '160px' } }, [
              h(MarTabs, {
                mode: 'strip',
                appearance: 'workbench',
                tabs: genericItems,
                idPrefix: 'generic-tabs',
                modelValue: genericActive.value,
                label: 'Generic tabs',
                onTabActivate: (id) => {
                  genericActive.value = id;
                  activations.value++;
                },
                onTabChange: () => changes.value++,
                onTabClose: (id) => (closed.value = id)
              }),
              ...genericItems.map((item) =>
                h(
                  'div',
                  {
                    id: tabStripIdentity('generic-tabs', item.name).panel,
                    role: 'tabpanel',
                    'aria-labelledby': tabStripIdentity('generic-tabs', item.name).tab,
                    style: { display: genericActive.value === item.name ? '' : 'none' }
                  },
                  item.label
                )
              )
            ]),
            new URLSearchParams(location.search).has('external-selection') &&
              h(
                'button',
                { onClick: () => (genericActive.value = 'a') },
                'Select first externally'
              ),
            h('output', { id: 'closed' }, closed.value),
            h('output', { id: 'activations' }, activations.value),
            h('output', { id: 'changes' }, changes.value)
          ];
        }
      })
        .provide(
          marUiLocaleKey,
          computed(() => (localePreferenceService().locale.value === 'zh-CN' ? zhCn : en))
        )
        .mount('#app');
    </script>
  </body>
</html>
