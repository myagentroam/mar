name: Feature proposal
description: Describe a problem and the outcome you need.
body:
  - type: markdown
    attributes:
      value: 'MyAgentRoam is maintainer-led. Proposals inform product direction but do not create a delivery or PR-merge commitment. See CONTRIBUTING.md before implementing a large change.'
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Who needs this and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe observable behavior, not just an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope
      description: Existing workarounds, related issues, and what should remain out of scope.
