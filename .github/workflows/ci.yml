name: CI smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos_validation:
        description: Run extended native validation on Apple Silicon and Intel macOS
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.macos_validation && 'macos-validation' || 'smoke' }}
  cancel-in-progress: true

jobs:
  remote-desktop-macos-native:
    name: Remote desktop macOS native feasibility
    if: ${{ inputs.macos_validation }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Build fixed macVNC source
        shell: bash
        run: |
          set -euo pipefail
          brew install libvncserver
          curl -fsSL https://codeload.github.com/LibVNC/macVNC/tar.gz/6c45640168dd170120d96661b3b711d283257166 | tar xz
          cmake -S macVNC-6c45640168dd170120d96661b3b711d283257166 -B macvnc-build
          cmake --build macvnc-build --parallel 2
          otool -L macvnc-build/macVNC.app/Contents/MacOS/macVNC

      - name: Probe real macVNC server and desktop permission
        shell: bash
        run: |
          set -euo pipefail
          binary=macvnc-build/macVNC.app/Contents/MacOS/macVNC
          "$binary" --help
          "$binary" -viewonly -localhost -rfbport 15991 >macvnc.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; cat macvnc.log' EXIT
          python3 -c 'import socket,time; deadline=time.monotonic()+20
          while True:
              try:
                  s=socket.create_connection(("127.0.0.1",15991),timeout=1); break
              except OSError:
                  if time.monotonic()>deadline: raise
                  time.sleep(.2)
          data=s.recv(12); print("RFB banner:",repr(data)); assert data.startswith(b"RFB ") and len(data)==12
          s.close()'
          sleep 3
          kill -0 "$pid"

  remote-desktop-windows-native:
    name: Remote desktop Windows native build
    if: ${{ inputs.macos_validation }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Build fixed UltraVNC source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://codeload.github.com/ultravnc/UltraVNC/tar.gz/c757708e83b6c8249a1cdc9b9c0427c4e72f1c21' -OutFile source.tar.gz
          tar -xzf source.tar.gz
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          & $msbuild 'UltraVNC-c757708e83b6c8249a1cdc9b9c0427c4e72f1c21\winvnc\winvnc.sln' /m /t:winvnc /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0.26100.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Path UltraVNC-c757708e83b6c8249a1cdc9b9c0427c4e72f1c21 -Filter winvnc.exe -Recurse | Format-List FullName,Length

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.macos_validation && fromJSON('["macos-15", "macos-15-intel"]') || fromJSON('["ubuntu-24.04", "windows-2025", "macos-15"]') }}
    env:
      MAR_TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: Set up pnpm
        shell: bash
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Node and its workspace dependencies
        run: pnpm --filter @myagentroam/node... build

      - name: Check compiled CLI entrypoints
        run: node --test test/unit/cli-smoke.test.mjs

      - name: Check Node health and process probes
        run: pnpm --filter @myagentroam/node exec vitest run --config vitest.config.mts test/unit/node-smoke.test.ts

      - name: Validate isolated PTY lifecycle on macOS
        if: ${{ inputs.macos_validation }}
        timeout-minutes: 3
        run: >-
          pnpm --filter @myagentroam/node exec vitest run --config vitest.config.mts
          --reporter=verbose
          test/unit/node-terminal-native.test.ts
          test/unit/terminal-pty.test.ts
          test/unit/terminal-resource-lifecycle.test.ts
          test/unit/terminal-posix-lifecycle.test.ts

      - name: Validate macOS filesystem, Git, SQLite, and locks
        if: ${{ inputs.macos_validation }}
        run: >-
          pnpm --filter @myagentroam/node exec vitest run --config vitest.config.mts
          --reporter=verbose
          test/unit/node-workspace.test.ts
          test/unit/node-files-git-history.test.ts
          test/unit/node-runtime-database.test.ts
          test/unit/node-process-lock.test.ts
          test/unit/git-execution-integration.test.ts

      - name: Validate macOS native integrations
        if: ${{ inputs.macos_validation }}
        env:
          MAR_MACOS_NATIVE_TESTS: '1'
        run: >-
          pnpm --filter @myagentroam/node exec vitest run --config vitest.config.mts
          --reporter=verbose
          test/unit/macos-native-integration.test.ts

      - name: Validate Agent shell execution on macOS
        if: ${{ inputs.macos_validation && !cancelled() }}
        run: pnpm --filter @myagentroam/agent exec vitest run --config vitest.config.ts test/unit/exec-shell.test.ts
