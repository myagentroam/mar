name: CI smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos_validation:
        description: Run extended native validation on Apple Silicon and Intel macOS
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.macos_validation && 'macos-validation' || 'smoke' }}
  cancel-in-progress: true

jobs:
  remote-desktop-macos-native:
    name: Remote desktop macOS native feasibility
    if: ${{ inputs.macos_validation }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out acceptance fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build fixed macVNC source
        shell: bash
        run: |
          set -euo pipefail
          brew install libvncserver
          curl -fsSL https://codeload.github.com/LibVNC/macVNC/tar.gz/6c45640168dd170120d96661b3b711d283257166 | tar xz
          patch -d macVNC-6c45640168dd170120d96661b3b711d283257166 -p1 < mar-node/test/native/macos-input-cleanup.patch
          cmake -S macVNC-6c45640168dd170120d96661b3b711d283257166 -B macvnc-build
          cmake --build macvnc-build --parallel 2
          otool -L macvnc-build/macVNC.app/Contents/MacOS/macVNC

      - name: Bundle macVNC and native libraries
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/remote-desktop-macos-native"
          python3 mar-node/test/native/macos-bundle.py macvnc-build/macVNC.app/Contents/MacOS/macVNC "$package"
          mkdir "$package/licenses"
          cp macVNC-6c45640168dd170120d96661b3b711d283257166/COPYING "$package/licenses/macVNC.txt"
          for formula in libvncserver jpeg-turbo libpng openssl@4; do
            prefix="$(brew --prefix "$formula")"
            license="$(find -L "$prefix" -type f \( -iname 'license*' -o -iname 'copying*' -o -iname 'copyright*' \) -print -quit)"
            if [ -z "$license" ]; then echo "Missing license for $formula" >&2; exit 1; fi
            cp "$license" "$package/licenses/$formula.txt"
          done
          brew list --versions libvncserver jpeg-turbo libpng openssl@4 > "$package/BUILD-DEPENDENCIES.txt"

      - name: Save macOS native package candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-desktop-macos-native
          path: ${{ runner.temp }}/remote-desktop-macos-native/
          if-no-files-found: error

      - name: Probe real macVNC capture and input
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/remote-desktop-macos-native/macVNC"
          swiftc mar-node/test/native/macos-desktop-window.swift -o "$RUNNER_TEMP/desktop-window"
          export MAR_DESKTOP_KEY_RECEIPT="$RUNNER_TEMP/key-receipt"
          export MAR_DESKTOP_MOUSE_RECEIPT="$RUNNER_TEMP/mouse-receipt"
          export MAR_DESKTOP_KEY_UP_RECEIPT="$RUNNER_TEMP/key-up-receipt"
          export MAR_DESKTOP_MOUSE_UP_RECEIPT="$RUNNER_TEMP/mouse-up-receipt"
          export MAR_DESKTOP_S_DOWN_RECEIPT="$RUNNER_TEMP/s-down-receipt"
          export MAR_DESKTOP_S_UP_RECEIPT="$RUNNER_TEMP/s-up-receipt"
          export MAR_DESKTOP_CTRL_SHIFT_RECEIPT="$RUNNER_TEMP/ctrl-shift-receipt"
          export MAR_DESKTOP_OPTION_RECEIPT="$RUNNER_TEMP/option-receipt"
          export MAR_DESKTOP_OPTION_S_RECEIPT="$RUNNER_TEMP/option-s-receipt"
          export MAR_DESKTOP_COMMAND_RECEIPT="$RUNNER_TEMP/command-receipt"
          "$RUNNER_TEMP/desktop-window" >window.log 2>&1 &
          window=$!
          DYLD_PRINT_LIBRARIES=1 "$binary" -viewonly -listen localhost -rfbport 15991 -rfbportv6 -1 >macvnc.log 2>&1 &
          pid=$!
          trap 'kill "$pid" "$window" 2>/dev/null || true; wait "$pid" "$window" 2>/dev/null || true; cat window.log macvnc.log; test ! -f macvnc-control.log || cat macvnc-control.log' EXIT
          sleep 3
          kill -0 "$pid"
          kill -0 "$window"
          python3 mar-node/test/native/desktop-native-rfb-probe.py 15991
          kill "$pid"
          wait "$pid" || true
          if grep -E '(/opt/homebrew/|/usr/local/opt/)' macvnc.log; then
            echo 'Packaged process loaded a Homebrew library' >&2; exit 1
          fi
          "$binary" -listen localhost -rfbport 15992 -rfbportv6 -1 >macvnc-control.log 2>&1 &
          pid=$!
          sleep 3
          kill -0 "$pid"
          python3 mar-node/test/native/desktop-native-rfb-probe.py 15992 control
          rm -f "$MAR_DESKTOP_KEY_RECEIPT" "$MAR_DESKTOP_MOUSE_RECEIPT" "$MAR_DESKTOP_KEY_UP_RECEIPT" "$MAR_DESKTOP_MOUSE_UP_RECEIPT"
          python3 mar-node/test/native/desktop-native-rfb-probe.py 15992 cleanup
          python3 mar-node/test/native/desktop-native-rfb-probe.py 15992 shift-cleanup
          python3 mar-node/test/native/desktop-native-rfb-probe.py 15992 ctrl-shift
          python3 mar-node/test/native/desktop-native-rfb-probe.py 15992 mac-modifiers

  remote-desktop-windows-native:
    name: Remote desktop Windows native acceptance
    if: ${{ inputs.macos_validation }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out acceptance fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare official UltraVNC 1.8.3.2 binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'UltraVNC_1832.zip'
          Invoke-WebRequest -Uri 'https://uvnc.eu/download/1800/UltraVNC_1832.zip' -OutFile $archive
          $sha = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($sha -ne '8984e920169238de2a878ca3af71b7b8ac4feb3bbe295916dcd3ff1219456aad') { throw "Official archive digest mismatch: $sha" }
          $expanded = Join-Path $env:RUNNER_TEMP 'ultravnc-official'
          Expand-Archive -Path $archive -DestinationPath $expanded
          $root = Join-Path $env:RUNNER_TEMP 'remote-desktop-native'
          New-Item -ItemType Directory -Path $root | Out-Null
          foreach ($name in @('winvnc.exe', 'vnchooks.dll', 'ddengine64.dll')) {
            Copy-Item (Join-Path $expanded "x64/$name") (Join-Path $root $name)
          }
          New-Item -ItemType File -Path (Join-Path $root 'ultravnc.portable') | Out-Null
          Get-ChildItem $root | Format-Table Name,Length

      - name: Save Windows native binary candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: remote-desktop-windows-native
          path: ${{ runner.temp }}/remote-desktop-native/
          if-no-files-found: error

      - name: Probe real Windows framebuffer and input
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'remote-desktop-native'
          $env:MAR_DESKTOP_KEY_RECEIPT = Join-Path $env:RUNNER_TEMP 'desktop-key-receipt'
          $env:MAR_DESKTOP_MOUSE_RECEIPT = Join-Path $env:RUNNER_TEMP 'desktop-mouse-receipt'
          $env:MAR_DESKTOP_KEY_UP_RECEIPT = Join-Path $env:RUNNER_TEMP 'desktop-key-up-receipt'
          $env:MAR_DESKTOP_MOUSE_UP_RECEIPT = Join-Path $env:RUNNER_TEMP 'desktop-mouse-up-receipt'
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = $listener.LocalEndpoint.Port
          $listener.Stop()
          $config = Join-Path $root 'ultravnc.ini'
          @('[admin]', 'LoopbackOnly=1', 'AllowLoopback=1', 'AuthRequired=0', 'SocketConnect=1', 'AutoPortSelect=0', "PortNumber=$port", 'InputsEnabled=1', 'QuerySetting=0') | Set-Content -Encoding Ascii $config
          $window = Start-Process powershell -ArgumentList @('-NoProfile', '-STA', '-File', (Join-Path $env:GITHUB_WORKSPACE 'mar-node/test/native/windows-desktop-window.ps1')) -PassThru
          $server = $null
          try {
            $server = Start-Process (Join-Path $root 'winvnc.exe') -ArgumentList @('-run', '-config', ('"' + $config + '"')) -WorkingDirectory $root -PassThru
            Start-Sleep -Seconds 3
            if ($server.HasExited) { throw "UltraVNC exited with code $($server.ExitCode)" }
            $listeners = @(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction Stop)
            $listeners | Format-Table LocalAddress,LocalPort,OwningProcess
            if ($listeners.Count -ne 1 -or $listeners[0].LocalAddress -ne '127.0.0.1') { throw 'UltraVNC is not listening exclusively on IPv4 loopback' }
            python mar-node/test/native/desktop-native-rfb-probe.py $port control
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item $env:MAR_DESKTOP_KEY_RECEIPT, $env:MAR_DESKTOP_MOUSE_RECEIPT, $env:MAR_DESKTOP_KEY_UP_RECEIPT, $env:MAR_DESKTOP_MOUSE_UP_RECEIPT
            python mar-node/test/native/desktop-native-rfb-probe.py $port release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item $env:MAR_DESKTOP_KEY_RECEIPT, $env:MAR_DESKTOP_MOUSE_RECEIPT, $env:MAR_DESKTOP_KEY_UP_RECEIPT, $env:MAR_DESKTOP_MOUSE_UP_RECEIPT
            python mar-node/test/native/desktop-native-rfb-probe.py $port native-release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item $env:MAR_DESKTOP_KEY_RECEIPT, $env:MAR_DESKTOP_MOUSE_RECEIPT, $env:MAR_DESKTOP_KEY_UP_RECEIPT, $env:MAR_DESKTOP_MOUSE_UP_RECEIPT
            $env:MAR_DESKTOP_SERVER_PID = $server.Id.ToString()
            python mar-node/test/native/desktop-native-rfb-probe.py $port native-after-stop
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item $env:MAR_DESKTOP_KEY_RECEIPT, $env:MAR_DESKTOP_MOUSE_RECEIPT, $env:MAR_DESKTOP_KEY_UP_RECEIPT, $env:MAR_DESKTOP_MOUSE_UP_RECEIPT
            $server = Start-Process (Join-Path $root 'winvnc.exe') -ArgumentList @('-run', '-config', ('"' + $config + '"')) -WorkingDirectory $root -PassThru
            Start-Sleep -Seconds 3
            if ($server.HasExited) { throw "UltraVNC restart exited with code $($server.ExitCode)" }
            python mar-node/test/native/desktop-native-rfb-probe.py $port cleanup
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id; $server.WaitForExit() }
            if ($window -and -not $window.HasExited) { Stop-Process -Id $window.Id; $window.WaitForExit() }
          }

  smoke:
    # This temporary acceptance branch dedicates the extended dispatch to native desktop jobs.
    if: ${{ !inputs.macos_validation }}
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.macos_validation && fromJSON('["macos-15", "macos-15-intel"]') || fromJSON('["ubuntu-24.04", "windows-2025", "macos-15"]') }}
    env:
      MAR_TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: Set up pnpm
        shell: bash
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Node and its workspace dependencies
        run: pnpm --filter @myagentroam/node... build

      - name: Check compiled CLI entrypoints
        run: node --test test/unit/cli-smoke.test.mjs

      - name: Check Node health and process probes
        run: pnpm --filter @myagentroam/node exec vitest run --config vitest.config.mts test/unit/node-smoke.test.ts

      - name: Validate isolated PTY lifecycle on macOS
        if: ${{ inputs.macos_validation }}
        timeout-minutes: 3
        run: >-
          pnpm --filter @myagentroam/node exec vitest run --config vitest.config.mts
          --reporter=verbose
          test/unit/node-terminal-native.test.ts
          test/unit/terminal-pty.test.ts
          test/unit/terminal-resource-lifecycle.test.ts
          test/unit/terminal-posix-lifecycle.test.ts

      - name: Validate macOS filesystem, Git, SQLite, and locks
        if: ${{ inputs.macos_validation }}
        run: >-
          pnpm --filter @myagentroam/node exec vitest run --config vitest.config.mts
          --reporter=verbose
          test/unit/node-workspace.test.ts
          test/unit/node-files-git-history.test.ts
          test/unit/node-runtime-database.test.ts
          test/unit/node-process-lock.test.ts
          test/unit/git-execution-integration.test.ts

      - name: Validate macOS native integrations
        if: ${{ inputs.macos_validation }}
        env:
          MAR_MACOS_NATIVE_TESTS: '1'
        run: >-
          pnpm --filter @myagentroam/node exec vitest run --config vitest.config.mts
          --reporter=verbose
          test/unit/macos-native-integration.test.ts

      - name: Validate Agent shell execution on macOS
        if: ${{ inputs.macos_validation && !cancelled() }}
        run: pnpm --filter @myagentroam/agent exec vitest run --config vitest.config.ts test/unit/exec-shell.test.ts
