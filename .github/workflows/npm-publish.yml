name: Publish sealed npm artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag matching this workflow ref and the sealed source
        type: string
        required: true
      manifest_sha256:
        description: SHA-256 of the approved npm-publication.json
        type: string
        required: true
      resume_run_id:
        description: Previous completed publication run for this exact candidate (continuation only)
        type: string
        required: false
      confirmed_absent:
        description: Continuation only; comma-separated unknown packages independently confirmed never accepted by npm (not merely a 404)
        type: string
        required: false
      resolution:
        description: Maintainer-reviewed evidence for confirmed_absent; never override a successful submission
        type: choice
        default: none
        options:
          - none
          - rejected-before-submit
          - registry-confirmed-absent

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish approved archives via OIDC
    runs-on: ubuntu-24.04
    environment: npm-production
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PUBLICATION_TAG: ${{ inputs.release_tag }}
      PUBLICATION_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      PUBLICATION_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      PUBLICATION_CONFIRMED_ABSENT: ${{ inputs.confirmed_absent }}
      PUBLICATION_RESOLUTION: ${{ inputs.resolution }}
    steps:
      - name: Check out the exact publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js without package-manager caching
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          package-manager-cache: false

      - name: Install the pinned OIDC-capable npm CLI
        run: npm install --global npm@11.15.0 --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Download the approved public release assets
        run: node scripts/npm-publish-github.mjs download
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify and submit the original archives
        run: node scripts/npm-publish-github.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Preserve the per-package submission receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-publication-result.json
          if-no-files-found: warn
          retention-days: 90
