<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyAgentRoam" />
    <link rel="icon" href="/favicon.ico?v=logo-20261011" sizes="32x32" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/app-icon-192.png?v=logo-20261011" />
    <title>My Agent Roam</title>
    <script>
      try {
        const consolePage = location.pathname !== '/' && location.pathname !== '/index.html';
        if (consolePage && localStorage.getItem('mar.theme') !== 'daylight') {
          document.documentElement.setAttribute('data-theme', 'vscode-dark-2026');
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').content = '#0e1116';
        }
      } catch {}
    </script>
    <style>
      .mar-bootstrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--mar-bg-page, #f3f6f9);
        opacity: 1;
        z-index: 9999;
      }

      .mar-bootstrap__stage {
        position: relative;
        display: grid;
        width: 1.25rem;
        height: 1.25rem;
        place-items: center;
      }

      .mar-bootstrap__trace {
        position: absolute;
        inset: 0;
        width: 1.25rem;
        height: 1.25rem;
        color: var(--mar-color-brand-text, #0a6fd8);
        box-sizing: border-box;
        border: 2px solid currentColor;
        border-inline-end-color: transparent;
        border-radius: 50%;
        animation: mar-bootstrap-orbit 1.2s linear infinite;
      }

      @keyframes mar-bootstrap-orbit {
        to {
          transform: rotate(360deg);
        }
      }

      html[data-theme='vscode-dark-2026'] .mar-bootstrap {
        background: var(--mar-bg-page, #0e1116);
      }

      html[data-theme='vscode-dark-2026'] .mar-bootstrap__trace {
        color: var(--mar-color-brand-text, #3093ff);
      }

      @media (prefers-reduced-motion: reduce) {
        .mar-bootstrap,
        .mar-bootstrap__trace {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="mar-bootstrap" class="mar-bootstrap" aria-hidden="true">
      <div class="mar-bootstrap__stage">
        <span class="mar-bootstrap__trace" aria-hidden="true"></span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
