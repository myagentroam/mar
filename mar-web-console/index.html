<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1a1a1a" />
    <script>
      {
        const root = document.documentElement;
        let scheme = 'dark';
        let background;
        try {
          const themeId = localStorage.getItem('mar.theme');
          if (themeId === 'daylight') {
            scheme = themeId;
          } else if (themeId?.startsWith('custom:')) {
            const cached = JSON.parse(localStorage.getItem('mar.themeBootstrap') ?? 'null');
            if (
              cached?.themeId === themeId &&
              (cached.scheme === 'daylight' || cached.scheme === 'dark') &&
              typeof cached.background === 'string' &&
              /^#(?:[\da-f]{3}|[\da-f]{4}|[\da-f]{6}|[\da-f]{8})$/iu.test(cached.background)
            ) {
              scheme = cached.scheme;
              background = cached.background;
            }
          }
        } catch {
          // Missing, blocked, or invalid storage leaves the built-in defaults in place.
        }
        if (scheme === 'dark') {
          root.setAttribute('data-theme', scheme);
          root.classList.add('dark');
        }
        if (background) root.style.setProperty('--mar-bootstrap-bg', background);
        document.querySelector('meta[name="theme-color"]').content =
          background ?? (scheme === 'daylight' ? '#f8fbff' : '#1a1a1a');
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyAgentRoam" />
    <link rel="icon" href="/favicon.ico?v=logo-20261011" sizes="32x32" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/app-icon-192.png?v=logo-20261011" />
    <title>MyAgentRoam - v%MAR_WEB_VERSION%</title>
    <style>
      .mar-bootstrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--mar-bootstrap-bg, var(--mar-bg-page, #f8fbff));
        opacity: 1;
        z-index: 9999;
      }

      .mar-bootstrap__stage {
        position: relative;
        display: grid;
        width: 1.25rem;
        height: 1.25rem;
        place-items: center;
      }

      .mar-bootstrap__trace {
        position: absolute;
        inset: 0;
        width: 1.25rem;
        height: 1.25rem;
        color: var(--mar-control-primary-bg, #0057db);
        box-sizing: border-box;
        border: 2px solid currentColor;
        border-inline-end-color: transparent;
        border-radius: 50%;
        animation: mar-bootstrap-orbit 1.2s linear infinite;
      }

      @keyframes mar-bootstrap-orbit {
        to {
          transform: rotate(360deg);
        }
      }

      html[data-theme='dark'] .mar-bootstrap {
        background: var(--mar-bootstrap-bg, var(--mar-bg-page, #1a1a1a));
      }

      html[data-theme='dark'] .mar-bootstrap__trace {
        color: var(--mar-control-primary-bg, #1789fc);
      }

      @media (prefers-reduced-motion: reduce) {
        .mar-bootstrap,
        .mar-bootstrap__trace {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="mar-bootstrap" class="mar-bootstrap" aria-hidden="true">
      <div class="mar-bootstrap__stage">
        <span class="mar-bootstrap__trace" aria-hidden="true"></span>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
