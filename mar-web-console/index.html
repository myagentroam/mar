<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyAgentRoam" />
    <link rel="icon" href="/favicon.ico?v=logo-20261011" sizes="32x32" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/app-icon-192.png?v=logo-20261011" />
    <title>My Agent Roam</title>
    <script>
      try {
        const consolePage = location.pathname !== '/' && location.pathname !== '/index.html';
        if (consolePage && localStorage.getItem('mar.theme') !== 'daylight') {
          document.documentElement.setAttribute('data-theme', 'vscode-dark-2026');
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').content = '#0e1116';
        }
      } catch {}
    </script>
    <style>
      .mar-bootstrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f3f6f9;
        opacity: 1;
        z-index: 9999;
        transition: opacity 180ms ease-out;
      }

      .mar-bootstrap--leaving {
        opacity: 0;
        pointer-events: none;
      }

      .mar-bootstrap__stage {
        position: relative;
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
      }

      .mar-bootstrap__trace {
        position: absolute;
        inset: 0;
        width: 56px;
        height: 56px;
        color: #0a6fd8;
      }

      .mar-bootstrap__orbit {
        transform-origin: 32px 32px;
        animation: mar-bootstrap-orbit 1.4s linear infinite;
      }

      @keyframes mar-bootstrap-orbit {
        to {
          transform: rotate(360deg);
        }
      }

      html[data-theme='vscode-dark-2026'] .mar-bootstrap {
        background: #0e1116;
      }

      html[data-theme='vscode-dark-2026'] .mar-bootstrap__trace {
        color: #3093ff;
      }

      @media (prefers-reduced-motion: reduce) {
        .mar-bootstrap,
        .mar-bootstrap__orbit {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="mar-bootstrap" class="mar-bootstrap" aria-hidden="true">
      <div class="mar-bootstrap__stage">
        <svg
          class="mar-bootstrap__trace"
          viewBox="0 0 64 64"
          fill="none"
          focusable="false"
          xmlns="http://www.w3.org/2000/svg"
        >
          <defs>
            <linearGradient
              id="mar-bootstrap-trail"
              x1="54"
              y1="10"
              x2="10"
              y2="32"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="currentColor" stop-opacity="0.08" />
              <stop offset="0.55" stop-color="currentColor" stop-opacity="0.55" />
              <stop offset="1" stop-color="currentColor" />
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="22" stroke="currentColor" stroke-width="0.75" opacity="0.12" />
          <g class="mar-bootstrap__orbit">
            <path
              fill="url(#mar-bootstrap-trail)"
              d="M32 9.9 C35.86 9.9 39.72 10.9 43.08 12.81 C46.44 14.72 49.3 17.52 51.28 20.87 C53.25 24.22 54.34 28.09 54.38 32 C54.42 35.91 53.42 39.83 51.5 43.26 C49.58 46.69 46.74 49.61 43.34 51.64 C39.94 53.67 35.99 54.8 32 54.87 C28.01 54.94 23.98 53.95 20.44 52.02 C16.89 50.09 13.83 47.23 11.64 43.76 C9.44 40.29 8.1 36.22 7.8 32 C7.65 30.3 8.35 29.05 9.8 28.5 C9.6 30 12.65 30.05 12.2 32 C11.9 35.46 12.62 39.06 14.26 42.24 C15.9 45.42 18.46 48.17 21.56 50.08 C24.67 51.99 28.31 53.06 32 53.13 C35.69 53.2 39.41 52.28 42.66 50.47 C45.91 48.65 48.69 45.96 50.6 42.74 C52.52 39.52 53.58 35.77 53.62 32 C53.66 28.23 52.69 24.43 50.83 21.13 C48.96 17.82 46.21 15.02 42.92 13.09 C39.63 11.16 35.82 10.1 32 10.1 Z"
            />
          </g>
        </svg>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
