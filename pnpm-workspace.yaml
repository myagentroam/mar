packages:
  - 'mar-agent'
  - 'mar-agent/extensions/*'
  - 'marctl'
  - 'mar-node'
  - 'mar-server'
  - 'mar-web-console'
  - 'packages/*'
  - 'ee/*'

injectWorkspacePackages: true

allowBuilds:
  # Server images prepare Chromium explicitly after deploying the workspace packages.
  '@myagentroam/node': false
  '@vue-office/docx': true
  '@vue-office/excel': true
  '@vue-office/pptx': true
  esbuild: true
  node-pty: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.233'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.233'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.233'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.233'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.233'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.233'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.233'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.233'
  - '@anthropic-ai/claude-agent-sdk@0.3.233'
  - '@opencode-ai/sdk@1.18.20'

patchedDependencies:
  '@novnc/novnc@1.7.0': patches/@novnc__novnc@1.7.0.patch

overrides:
  '@myagentroam/binaries-linux-x64': 'workspace:0.10.2'
  '@myagentroam/binaries-linux-arm64': 'workspace:0.10.2'
  '@myagentroam/binaries-darwin-x64': 'workspace:0.10.2'
  '@myagentroam/binaries-darwin-arm64': 'workspace:0.10.2'
  '@myagentroam/binaries-win32-x64': 'workspace:0.10.2'
  '@myagentroam/binaries-win32-arm64': 'workspace:0.10.2'
